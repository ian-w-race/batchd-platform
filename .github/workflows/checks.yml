# Runs the repository checks on every pull request and every push to main.
# Local equivalent:  node scripts/check.mjs && node --test tests/*.test.mjs
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository checks
        run: node scripts/check.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
