# ── Domain hygiene (2026-08-06) ─────────────────────────────
# One Netlify site serves every domain, so by default every file is
# reachable on every domain. These HOST-SCOPED rules give each domain
# one job: corporate.batchdapp.com is the dashboard (clean root URL),
# app.batchdapp.com / batchd-app.netlify.app are the scanner. Rules are
# host-exact, so staging-- and deploy-preview-- subdomains are
# unaffected. The JS domain-detection at the top of index.html still
# handles the retired manufacturer/admin/supplier stubs.

# corporate root serves the dashboard without /dashboard.html in the URL
[[redirects]]
  from = "https://corporate.batchdapp.com/"
  to = "/dashboard.html"
  status = 200
  force = true

# canonicalise the file path on corporate to the clean root
[[redirects]]
  from = "https://corporate.batchdapp.com/dashboard.html"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

# the dashboard is only presented on corporate.*
[[redirects]]
  from = "https://app.batchdapp.com/dashboard.html"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://batchd-app.netlify.app/dashboard.html"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

# Extensionless paths (2026-09-13). Netlify's Pretty URLs setting (asset
# optimization in the Netlify UI, not in this file) serves every page at
# its extensionless path and rewrites links in the deployed HTML to match.
# Verified 2026-09-13: /dashboard.html 301'd correctly, but /dashboard
# served the dashboard on the scanner domains, and www.batchdapp.com had
# no rule at all. These five rules close both gaps. Netlify passes the
# query string through on these 301s, so ?panel=recalls survives.
[[redirects]]
  from = "https://corporate.batchdapp.com/dashboard"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://app.batchdapp.com/dashboard"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://batchd-app.netlify.app/dashboard"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.batchdapp.com/dashboard.html"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.batchdapp.com/dashboard"
  to = "https://corporate.batchdapp.com/"
  status = 301
  force = true

