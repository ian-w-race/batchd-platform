# ── One address (2026-11-01, Phase 2a step 2) ───────────────
# Every app lives on app.batchdapp.com: / is the sign-in page, /retail the
# Retail app (dashboard.html), /scan the scanner (index.html). The browser
# keeps a sign-in per address, so one address means one sign-in.
# Old addresses forward with the path's query string kept (Netlify appends
# it to a 301), so old links and links in sent emails still land:
# - corporate.batchdapp.com: the root and /dashboard go to /retail; any
#   other path goes to the same path on app.batchdapp.com.
# - /dashboard(.html) on app., www. and batchd-app.netlify.app go to /retail.
# - www.batchdapp.com/ goes to app.batchdapp.com/. Other www paths stay:
#   complaint-widget.js posts to www's triage function.
# - batchd-app.netlify.app keeps serving the scanner: phones that installed
#   it from there sync their offline queue first, then index.html shows a
#   "Batch'd has moved" screen pointing at app.batchdapp.com/scan.
# This block sits first because Netlify uses the first matching rule: the
# path aliases below (/retail, /join and so on) must not answer on the old
# hosts. Rules are host-exact, so deploy previews (name--site.netlify.app) serve
# index.html at / and use /login, /retail and /scan from the rules above.
# ── Build (improvement plan A2, 2026-11-01) ─────────────────────
# scripts/build.mjs copies the public pages and static files into dist/ and
# bundles src/shared/ into dist/assets/batchd-shared.js. Netlify publishes
# dist/, so private files are never deployed; the forced 404s further down
# stay as a second line of defense. Functions stay in netlify/functions.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://corporate.batchdapp.com/"
  to = "https://app.batchdapp.com/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://corporate.batchdapp.com/dashboard.html"
  to = "https://app.batchdapp.com/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://corporate.batchdapp.com/dashboard"
  to = "https://app.batchdapp.com/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://corporate.batchdapp.com/*"
  to = "https://app.batchdapp.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://app.batchdapp.com/dashboard.html"
  to = "/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://app.batchdapp.com/dashboard"
  to = "/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://batchd-app.netlify.app/dashboard.html"
  to = "https://app.batchdapp.com/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://batchd-app.netlify.app/dashboard"
  to = "https://app.batchdapp.com/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://www.batchdapp.com/"
  to = "https://app.batchdapp.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.batchdapp.com/dashboard.html"
  to = "https://app.batchdapp.com/retail"
  status = 301
  force = true

[[redirects]]
  from = "https://www.batchdapp.com/dashboard"
  to = "https://app.batchdapp.com/retail"
  status = 301
  force = true

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/manufacturer"
  to = "/manufacturer.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

# Legal pages (2026-08-06): signup previously linked batchd.no/terms and
# /privacy, both of which 404'd. The documents now live in this repo and
# resolve on every domain this site serves.
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# ── Central sign-in on one address (2026-11-01) ─────────────
# docs/PORTALS-PLAN.md, Phase 2a, step 1. /login is the sign-in page and
# app router on every host (deploy previews included). /retail and /scan
# open the dashboard and the scanner under the same address, so one
# sign-in serves both: the browser keeps the session per address. On
# app.batchdapp.com the root is the sign-in page. The old addresses are
# forwarded in the "One address" block below.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/retail"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/scan"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "https://app.batchdapp.com/"
  to = "/login.html"
  status = 200
  force = true

# ── Functions bundler (2026-09-20) ───────────────────────────────────
# netlify/lib/auth.js is shared by several functions via require('../lib/auth').
# esbuild follows that require and bundles it into each function.
[functions]
  node_bundler = "esbuild"

