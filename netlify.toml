# Function source (2026-10-08). The publish directory is the repo root, so
# netlify/functions/*.js and netlify/lib/auth.js were served as static files
# on every domain (verified: HTTP 200 with the source). They hold no secrets
# (environment variables only) but they are server code. Function invocation
# uses /.netlify/functions/<name>, a different prefix, so this rule does not
# affect it.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
