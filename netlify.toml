# ── Security headers (2026-09-20) ───────────────────────────────────────
# No page in this repo is designed to be framed (complaint-widget.js is a script
# embed, not an iframe). Do NOT add camera=() to Permissions-Policy: the scanner
# uses the camera. A full script-src CSP is not possible yet (inline handlers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# The invite token travels in the query string: no referrer, no caching.
[[headers]]
  for = "/join*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# ── Scheduled functions ─────────────────────────────────────
# recall-escalation runs every 30 minutes and sends 2h/24h escalation
# emails to stores that haven't acknowledged recalls.
# Netlify scheduled functions require a Pro plan or higher.
[functions.recall-escalation]
  schedule = "*/30 * * * *"

# fetch-recall-feeds imports FDA + Mattilsynet recalls into the recalls
# table for every retailer org, daily at 06:00 UTC. The in-file
# `exports.schedule` in the function was never registered by Netlify —
# toml registration added 2026-08-05 so the import actually runs without
# a staff phone having the scanner open.
[functions.fetch-recall-feeds]
  schedule = "0 6 * * *"

# Daily health check (2026-10-25, improvement plan A4): reads job_runs and
# emails the platform admins when a job has not run or has failed.
[functions."health-check"]
  schedule = "0 7 * * *"
